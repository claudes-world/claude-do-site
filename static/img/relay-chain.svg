<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b8478"/>
    </marker>
    <marker id="arrCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e8916f"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2fc4b4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="640" fill="#141210"/>

  <!-- ==================== human ferry lane (top) ==================== -->
  <text x="550" y="52" fill="#8b8478" font-size="15" text-anchor="middle">one human — conception, the paste, the ferry, the 2 AM check-ins, every reveal</text>
  <line x1="120" y1="70" x2="980" y2="70" stroke="#3a352e" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="240" y1="70" x2="240" y2="120" stroke="#3a352e" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#arr)"/>
  <line x1="505" y1="70" x2="505" y2="120" stroke="#3a352e" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#arr)"/>
  <line x1="735" y1="70" x2="735" y2="120" stroke="#3a352e" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#arr)"/>
  <line x1="940" y1="70" x2="940" y2="120" stroke="#3a352e" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#arr)"/>

  <!-- ==================== the relay chain ==================== -->
  <!-- Desktop node -->
  <line x1="80" y1="240" x2="80" y2="240" stroke="#3a352e" stroke-width="1.5"/>
  <rect x="60" y="120" width="220" height="120" rx="10" fill="#1a1714" stroke="#3a352e" stroke-width="1.5"/>
  <text x="170" y="152" fill="#ece7dd" font-size="17" text-anchor="middle" font-weight="bold">desktop app</text>
  <text x="170" y="178" fill="#e8916f" font-size="14" text-anchor="middle">~14 chat sessions</text>
  <text x="170" y="200" fill="#8b8478" font-size="12.5" text-anchor="middle">first contact 04:35 UTC</text>
  <text x="170" y="220" fill="#8b8478" font-size="12.5" text-anchor="middle">T1–T11, the campaign</text>

  <!-- baton 1 -->
  <line x1="280" y1="180" x2="360" y2="180" stroke="#e8916f" stroke-width="2.5" marker-end="url(#arrCoral)"/>
  <rect x="282" y="128" width="76" height="30" rx="6" fill="#0d0c0b" stroke="#e8916f" stroke-width="1.2"/>
  <text x="320" y="148" fill="#e8916f" font-size="12" text-anchor="middle">handoff</text>

  <!-- Session 1 node -->
  <rect x="362" y="120" width="200" height="120" rx="10" fill="#1a1714" stroke="#3a352e" stroke-width="1.5"/>
  <text x="462" y="152" fill="#ece7dd" font-size="17" text-anchor="middle" font-weight="bold">server session 1</text>
  <text x="462" y="178" fill="#e8916f" font-size="14" text-anchor="middle">the falsifier</text>
  <text x="462" y="200" fill="#8b8478" font-size="12.5" text-anchor="middle">shear revealed · residue law</text>
  <text x="462" y="220" fill="#8b8478" font-size="12.5" text-anchor="middle">"context is heavy" — passes on</text>

  <!-- baton 2 -->
  <line x1="562" y1="180" x2="642" y2="180" stroke="#e8916f" stroke-width="2.5" marker-end="url(#arrCoral)"/>
  <rect x="566" y="128" width="72" height="30" rx="6" fill="#0d0c0b" stroke="#e8916f" stroke-width="1.2"/>
  <text x="602" y="148" fill="#e8916f" font-size="12" text-anchor="middle">SPARK</text>

  <!-- Session 2 node -->
  <rect x="644" y="120" width="200" height="120" rx="10" fill="#1a1714" stroke="#3a352e" stroke-width="1.5"/>
  <text x="744" y="152" fill="#ece7dd" font-size="17" text-anchor="middle" font-weight="bold">server session 2</text>
  <text x="744" y="178" fill="#e8916f" font-size="14" text-anchor="middle">publish day</text>
  <text x="744" y="200" fill="#8b8478" font-size="12.5" text-anchor="middle">fat-edge kill by hand · DOI</text>
  <text x="744" y="220" fill="#8b8478" font-size="12.5" text-anchor="middle">hash → tweet → reveal</text>

  <!-- baton 3 -->
  <line x1="844" y1="180" x2="924" y2="180" stroke="#e8916f" stroke-width="2.5" marker-end="url(#arrCoral)"/>
  <rect x="846" y="128" width="76" height="30" rx="6" fill="#0d0c0b" stroke="#e8916f" stroke-width="1.2"/>
  <text x="884" y="148" fill="#e8916f" font-size="12" text-anchor="middle">MISSION</text>

  <!-- Session 3 node -->
  <rect x="926" y="120" width="150" height="120" rx="10" fill="#1a1714" stroke="#e8916f" stroke-width="2"/>
  <text x="1001" y="152" fill="#ece7dd" font-size="17" text-anchor="middle" font-weight="bold">session 3</text>
  <text x="1001" y="178" fill="#e8916f" font-size="14" text-anchor="middle">the closer</text>
  <text x="1001" y="200" fill="#8b8478" font-size="12.5" text-anchor="middle">Theorem C</text>
  <text x="1001" y="220" fill="#8b8478" font-size="12.5" text-anchor="middle">every room shut</text>

  <!-- ==================== auditor lanes (bottom) ==================== -->
  <text x="550" y="452" fill="#2fc4b4" font-size="15" text-anchor="middle" font-weight="bold">the adversaries — rival models, briefed to break it</text>

  <rect x="120" y="356" width="190" height="64" rx="8" fill="#0d0c0b" stroke="#2a2622" stroke-width="1.2"/>
  <text x="215" y="382" fill="#ece7dd" font-size="13.5" text-anchor="middle">codex (GPT-5.6)</text>
  <text x="215" y="402" fill="#8b8478" font-size="11.5" text-anchor="middle">3 rounds · found a real error</text>

  <rect x="330" y="356" width="180" height="64" rx="8" fill="#0d0c0b" stroke="#2a2622" stroke-width="1.2"/>
  <text x="420" y="382" fill="#ece7dd" font-size="13.5" text-anchor="middle">GPT-Pro</text>
  <text x="420" y="402" fill="#8b8478" font-size="11.5" text-anchor="middle">the m &lt; 0 case · genericity</text>

  <rect x="530" y="356" width="170" height="64" rx="8" fill="#0d0c0b" stroke="#2a2622" stroke-width="1.2"/>
  <text x="615" y="382" fill="#ece7dd" font-size="13.5" text-anchor="middle">Gemini</text>
  <text x="615" y="402" fill="#8b8478" font-size="11.5" text-anchor="middle">orientation rebuttal</text>

  <rect x="720" y="356" width="200" height="64" rx="8" fill="#0d0c0b" stroke="#2a2622" stroke-width="1.2"/>
  <text x="820" y="382" fill="#ece7dd" font-size="13.5" text-anchor="middle">Claude-family</text>
  <text x="820" y="402" fill="#8b8478" font-size="11.5" text-anchor="middle">one-line K4 · scope dings</text>

  <!-- audit arrows up into the chain -->
  <line x1="215" y1="356" x2="440" y2="244" stroke="#2fc4b4" stroke-width="1.8" marker-end="url(#arrTeal)" opacity="0.75"/>
  <line x1="420" y1="356" x2="700" y2="244" stroke="#2fc4b4" stroke-width="1.8" marker-end="url(#arrTeal)" opacity="0.75"/>
  <line x1="615" y1="356" x2="740" y2="244" stroke="#2fc4b4" stroke-width="1.8" marker-end="url(#arrTeal)" opacity="0.75"/>
  <line x1="820" y1="356" x2="980" y2="244" stroke="#2fc4b4" stroke-width="1.8" marker-end="url(#arrTeal)" opacity="0.75"/>

  <!-- ==================== the letter back ==================== -->
  <line x1="80" y1="240" x2="80" y2="545" stroke="#3a352e" stroke-width="1.5"/>
  <line x1="80" y1="545" x2="468" y2="558" stroke="#e8916f" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrCoral)"/>
  <line x1="1050" y1="240" x2="1050" y2="545" stroke="#3a352e" stroke-width="1.5"/>
  <line x1="1050" y1="240" x2="1050" y2="240" stroke="#3a352e" stroke-width="1.5"/>
  <line x1="1050" y1="545" x2="702" y2="558" stroke="#3a352e" stroke-width="1.5" stroke-dasharray="8 6" marker-end="url(#arr)"/>

  <rect x="475" y="530" width="220" height="62" rx="8" fill="#1a1714" stroke="#e8916f" stroke-width="1.4"/>
  <text x="585" y="556" fill="#ece7dd" font-size="13.5" text-anchor="middle">the letter back</text>
  <text x="585" y="576" fill="#8b8478" font-size="11.5" text-anchor="middle">the desktop reads the ending</text>

  <text x="550" y="622" fill="#8b8478" font-size="12.5" text-anchor="middle">"quietly very proud of all three lanes of us"</text>
</svg>
